<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Armazém Parada Obrigatória</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Montserrat:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            padding: 50px 20px;
            text-align: center;
            border-bottom: 8px solid #FFA500;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(45deg,
                    transparent,
                    transparent 10px,
                    rgba(255, 165, 0, 0.05) 10px,
                    rgba(255, 165, 0, 0.05) 20px);
            pointer-events: none;
        }

        header>* {
            position: relative;
            z-index: 1;
        }

        header h1 {
            font-size: 2.5em;
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
            color: #FFA500;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav {
            background: #1a1a1a;
            padding: 0;
            text-align: center;
            border-bottom: 4px solid #FFA500;
        }

        .nav a {
            color: white;
            text-decoration: none;
            padding: 18px 25px;
            display: inline-block;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .nav a:hover {
            color: #FFA500;
            background: rgba(255, 165, 0, 0.1);
        }

        .container {
            flex: 1;
            max-width: 420px;
            width: 100%;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            border-left: 6px solid #FFA500;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 30px;
            color: #1a1a1a;
            font-size: 1.8em;
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 3px solid #FFA500;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 700;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 0;
            border: 2px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #FFA500;
            box-shadow: 0 0 0 3px rgba(255, 165, 0, 0.1);
        }

        input::placeholder {
            color: #999;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FFA500 0%, #FF8C00 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 165, 0, 0.3);
        }

        button:active {
            transform: translateY(-1px);
        }

        .mensagem {
            padding: 15px;
            margin: 20px 0 0 0;
            border-radius: 6px;
            display: none;
            font-weight: 600;
            border-left: 6px solid;
        }

        .mensagem.erro {
            background: #ffebee;
            color: #c00;
            border-left-color: #c00;
        }

        .mensagem.sucesso {
            background: #e8f5e9;
            color: #2e7d32;
            border-left-color: #2e7d32;
        }

        .link-home {
            text-align: center;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .link-home a {
            color: #FFA500;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .link-home a:hover {
            color: #FF8C00;
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.8em;
            }

            .container {
                margin: 20px;
                padding: 25px;
            }

            h2 {
                font-size: 1.4em;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>⚙️ Armazém Parada Obrigatória - Admin</h1>
    </header>

    <nav class="nav">
        <a href="index.html">Início</a>
    </nav>

    <div class="container">
        <h2>🔒 Login Admin</h2>
        <form id="formLogin">
            <div class="form-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="seu_usuario" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>
            <button type="submit">Entrar na Área Admin</button>
        </form>

        <div id="mensagem" class="mensagem"></div>

        <div class="link-home">
            <p><a href="index.html">← Voltar ao início</a></p>
        </div>
    </div>

    <script>
        if (localStorage.getItem('admin')) {
            window.location.href = 'admin.html';
        }

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();

            const dados = {
                usuario: document.getElementById('usuario').value,
                senha: document.getElementById('senha').value
            };

            const resp = await fetch('/api/login-admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            const result = await resp.json();
            const msg = document.getElementById('mensagem');

            if (result.sucesso) {
                localStorage.setItem('admin', JSON.stringify(result.admin));
                window.location.href = 'admin.html';
            } else {
                msg.className = 'mensagem erro';
                msg.textContent = result.erro;
                msg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
