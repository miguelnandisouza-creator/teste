<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Armazém Parada Obrigatória</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Montserrat:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #1a1a1a;
            padding: 50px 20px;
            text-align: center;
            border-bottom: 8px solid #FFFF00;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(45deg,
                    transparent,
                    transparent 10px,
                    rgba(255, 165, 0, 0.05) 10px,
                    rgba(255, 165, 0, 0.05) 20px);
            pointer-events: none;
        }

        header>* {
            position: relative;
            z-index: 1;
        }

        header h1 {
            font-size: 2.5em;
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
            color: #FFFF00;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav {
            background: #1a1a1a;
            padding: 0;
            text-align: center;
            border-bottom: 4px solid #FFFF00;
        }

        .nav a {
            color: #1a1a1a;
            text-decoration: none;
            padding: 18px 25px;
            display: inline-block;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .nav a:hover {
            color: #FFFF00;
            background: rgba(255, 255, 0, 0.1);
        }

        .container {
            flex: 1;
            max-width: 420px;
            width: 100%;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            border-left: 6px solid #FFFF00;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 30px;
            color: #1a1a1a;
            font-size: 1.8em;
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 3px solid #FFFF00;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 700;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 0;
            border: 2px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #FFFF00;
            box-shadow: 0 0 0 3px rgba(255, 255, 0, 0.1);
        }

        input::placeholder {
            color: #999;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #FFFF00;
            color: #1a1a1a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 255, 0, 0.3);
        }

        button:active {
            transform: translateY(-1px);
        }

        .mensagem {
            padding: 15px;
            margin: 20px 0 0 0;
            border-radius: 6px;
            display: none;
            font-weight: 600;
            border-left: 6px solid;
        }

        .mensagem.erro {
            background: #ffebee;
            color: #c00;
            border-left-color: #c00;
        }

        .mensagem.sucesso {
            background: #e8f5e9;
            color: #2e7d32;
            border-left-color: #2e7d32;
        }

        .link-cadastro {
            text-align: center;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .link-cadastro a {
            color: #FFFF00;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .link-cadastro a:hover {
            color: #FFD700;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-senha {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.2em;
            color: #666;
            background: none;
            border: none;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-senha:hover {
            color: #FFFF00;
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.8em;
            }

            .container {
                margin: 20px;
                padding: 25px;
            }

            h2 {
                font-size: 1.4em;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1><span id="cart-icon" style="cursor:pointer">🛒</span> Armazém Parada Obrigatória</h1>
    </header>

    <nav class="nav">
        <a href="index.html">Início</a>
        <a href="cadastro.html">Cadastre-se</a>
        <a href="admin-login.html" id="admin-link" style="display:none">Área Admin</a>
    </nav>

    <div class="container">
        <h2>🔐 Login</h2>
        <form id="formLogin">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="senha" placeholder="••••••••" required>
                    <button type="button" class="toggle-senha" onclick="toggleSenha('senha')">👁️</button>
                </div>
            </div>
            <button type="submit">Entrar na Conta</button>
        </form>

        <div id="mensagem" class="mensagem"></div>

        <div class="link-cadastro"
            style="margin-top:40px;padding-top:40px;border-top:2px solid #f0f0f0;text-align:center;font-size:0.9em;">
            <p><strong>📍 Endereço:</strong><br>R. João Adolfo Corrêa, 760<br>Passo do Gado - Tubarão - SC<br>CEP:
                88706-201</p>
            <p style="margin-top:12px;"><strong>📞 Telefone:</strong> (48) 99137-7066</p>
            <p style="margin-top:12px;"><strong>🕒 Horário:</strong><br>Seg-Sex: 8h às 20h<br>Sáb: 8h às 19h • Dom: 8h
                às 12h</p>
            <p style="margin-top:20px;border-top:1px solid #ddd;padding-top:20px;">Não tem conta? <a
                    href="cadastro.html" style="color:#FFFF00;">Cadastre-se</a></p>
        </div>
    </div>

    <script>
        function toggleSenha(fieldId) {
            const campo = document.getElementById(fieldId);
            const tipo = campo.type === 'password' ? 'text' : 'password';
            campo.type = tipo;
        }

        // Se já estiver logado, vai para pedido
        if (localStorage.getItem('cliente')) {
            window.location.href = 'pedido.html';
        }

        // Atalho escondido: clicar 3x no ícone do carrinho revela o link admin
        (function () {
            let contador = 0;
            const cartIcon = document.getElementById('cart-icon');
            if (cartIcon) {
                cartIcon.addEventListener('click', () => {
                    contador++;
                    if (contador >= 3) {
                        const link = document.getElementById('admin-link');
                        if (link) link.style.display = link.style.display === 'none' ? 'inline-block' : 'none';
                        contador = 0;
                    }
                });
            }
        })();

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const msg = document.getElementById('mensagem');

            // Se o usuário informar 'admin' como email, tentar login admin
            if (email && email.toLowerCase() === 'admin') {
                try {
                    const resp = await fetch('/api/login-admin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ usuario: 'admin', senha: senha })
                    });
                    const result = await resp.json();
                    if (result.sucesso) {
                        localStorage.setItem('admin', JSON.stringify({ usuario: 'admin' }));
                        window.location.href = 'admin.html';
                        return;
                    } else {
                        msg.className = 'mensagem erro';
                        msg.textContent = result.erro || 'Credenciais admin inválidas';
                        msg.style.display = 'block';
                        return;
                    }
                } catch (err) {
                    msg.className = 'mensagem erro';
                    msg.textContent = 'Erro ao comunicar com o servidor';
                    msg.style.display = 'block';
                    return;
                }
            }

            // Login cliente padrão
            try {
                const resp = await fetch('/api/login-cliente', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, senha: senha })
                });
                const result = await resp.json();
                if (result.sucesso) {
                    localStorage.setItem('cliente', JSON.stringify(result.cliente));
                    window.location.href = 'pedido.html';
                } else {
                    msg.className = 'mensagem erro';
                    msg.textContent = result.erro || 'Credenciais inválidas';
                    msg.style.display = 'block';
                }
            } catch (err) {
                msg.className = 'mensagem erro';
                msg.textContent = 'Erro de conexão';
                msg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
